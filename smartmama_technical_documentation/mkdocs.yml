site_name: SmartMama Technical Documentation
site_description: Technical documentation for the SmartMama maternal-health platform
site_url: https://<your-github-org>.github.io/<your-repository>/
repo_name: SmartMama
theme:
  name: material
  language: en
  logo: assets/images/smartmama-logo.png
  favicon: assets/images/smartmama-logo.png
  system-architecture-diagram: assets/images/system-architecture.jpeg
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - content.code.copy
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed
plugins:
  - search
extra_css:
  - assets/stylesheets/style.css
nav:
  - Architecture:
    - SmartMama Architecture: architecture/index.md
  - Backend:
    - Backend Overview: backend/index.md
  - Database:
    - Database Overview: database/index.md
  - AI:
    - Random Forest: ai/index.md
  - Mobile:
    - Mobile Overview: mobile/index.md
  - Web / Dashboards:
    - Web Overview: web/index.md
  - Security:
    - Security Overview: security/index.md
  - Integrations:
      - Integration Overview: integrations/index.md
      - PayPal Payments: integrations/paypal.md
  - Testing & QA:
      - Testing Strategy: testing/index.md
  - Code Standards:
      - Code Style: standards/code-style.md
  - Deployment:
      - Deployment Overview: deployment/index.md
  - Product & UX:
      - Product Design: ux/product-design.md
  - Glossary:
      - Glossary: glossary/glossary.md
